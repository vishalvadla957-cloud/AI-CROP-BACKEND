# Server
server.port=${PORT:8080}
server.servlet.context-path=/api

# Import local properties if present (local.properties is in .gitignore)
spring.config.import=optional:file:./local.properties,optional:file:../local.properties,optional:classpath:local.properties

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/ai_crop_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate (Auto-detects MySQL, suppresses Open-In-View warning)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=AiCropAdvisoryPlatformSecretKey2024SuperSecureKey256Bits
jwt.expiration=604800000

# Groq AI Assistant
groq.api.key=${GROQ_API_KEY:${GROQ_API:YOUR_GROQ_API_KEY_HERE}}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}

# Logging
logging.level.com.aicrop=INFO
logging.level.org.springframework.security=WARN

# CORS
cors.allowed-origins=http://localhost:3000,http://127.0.0.1:5500,http://localhost:5500,null
