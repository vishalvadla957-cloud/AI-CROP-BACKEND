# Server
server.port=${PORT:8080}
server.servlet.context-path=/api

# Import local properties if present (local.properties is in .gitignore)
spring.config.import=optional:file:./local.properties,optional:file:../local.properties,optional:classpath:local.properties

# Database (Supports Cloud MySQL via env vars or embedded H2 database out-of-the-box)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/aicropdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# JPA / Hibernate (Auto-detects MySQL, suppresses Open-In-View warning)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=AiCropAdvisoryPlatformSecretKey2024SuperSecureKey256Bits
jwt.expiration=604800000

# Groq AI Assistant
groq.api.key=${GROQ_API_KEY:${GROQ_API:YOUR_GROQ_API_KEY_HERE}}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}

# Logging
logging.level.com.aicrop=INFO
logging.level.org.springframework.security=WARN

# CORS
cors.allowed-origins=http://localhost:3000,http://127.0.0.1:5500,http://localhost:5500,null
